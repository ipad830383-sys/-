
<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>꿈틀꿈틀 모의주식</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#f4f5f7;
  font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR",sans-serif;
  color:#17181a
}

.wrap{max-width:900px;margin:auto;padding:16px}

.card{
  background:#fff;
  border-radius:18px;
  padding:18px;
  margin:12px 0;
  box-shadow:0 2px 12px #0000000d
}

h1{margin:0 0 5px}
h2{font-size:19px}

.muted{color:#777;font-size:13px}

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px
}

.stat{
  background:#f7f7f8;
  border-radius:13px;
  padding:13px
}

.big{
  font-size:21px;
  font-weight:800;
  margin-top:4px
}

.row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  padding:13px 0;
  border-bottom:1px solid #eee
}

.row:last-child{border:0}

.actions{
  display:flex;
  gap:5px;
  align-items:center
}

.actions input{width:85px;min-width:85px}

input,button{
  padding:10px;
  border:1px solid #ddd;
  border-radius:10px;
  font-size:15px
}

input{
  min-width:0;
  background:white;
  color:#17181a
}

button{
  border:0;
  font-weight:700;
  cursor:pointer
}

.primary{background:#111;color:white}
.buy{background:#eaf1ff;color:#2363d1}
.sell{background:#ffeded;color:#d33}

.up{color:#d33}
.down{color:#2866c7}

#game,#adminControls{display:none}

.stock-price{
  font-weight:750;
  text-align:right;
  line-height:1.6;
  white-space:normal
}

.news-item{
  padding:13px 0;
  border-bottom:1px solid #eee
}

.news-item:last-child{border-bottom:0}

.news-top{
  display:flex;
  align-items:center;
  gap:7px;
  margin-bottom:6px;
  flex-wrap:wrap
}

.news-category{
  background:#f0f0f0;
  color:#555;
  font-size:11px;
  padding:4px 8px;
  border-radius:20px;
  font-weight:700
}

.news-title{
  font-weight:750;
  margin-bottom:5px;
  line-height:1.5
}

.news-description{
  color:#666;
  font-size:13px;
  line-height:1.6
}

.news-time{color:#999;font-size:11px}

@media(max-width:600px){
  .stats{grid-template-columns:1fr}

  .row{flex-wrap:wrap}

  .stock-info{width:45%}

  .stock-price{
    width:100%;
    text-align:left;
    order:2
  }

  .actions{width:100%;order:3}

  .actions input{flex:1}
  .actions button{flex:1}
}
</style>
</head>

<body>
<div class="wrap">

  <div class="card">
    <h1>📈 꿈틀꿈틀 실시간 모의주식</h1>
    <div class="muted">모든 참가자가 같은 주가를 공유합니다.</div>

    <div id="login" style="margin-top:14px">
      <input id="name" maxlength="20" placeholder="닉네임">
      <button class="primary" onclick="join()">참가하기</button>
    </div>

    <div id="game">
      <p id="status"></p>

      <div class="stats">
        <div class="stat">
          총자산
          <div id="assets" class="big">500,000</div>
        </div>

        <div class="stat">
          수익률
          <div id="ret" class="big">0.00%</div>
        </div>

        <div class="stat">
          보유 현금
          <div id="cash" class="big">₩500,000</div>
        </div>
      </div>
    </div>
  </div>

  <div class="card">
    <h2>💼 내 보유 주식</h2>
    <div id="holdingsList">
      <div class="muted">참가 후 보유 현황이 표시됩니다.</div>
    </div>
  </div>

  <div class="card" id="newsCard">
    <h2>📰 실시간 경제·기업 뉴스</h2>

    <div class="muted" style="margin-bottom:10px">
      매 라운드마다 새로운 뉴스가 무작위로 생성됩니다.
    </div>

    <div id="newsList">
      <div class="muted">게임 시작 후 뉴스가 생성됩니다.</div>
    </div>
  </div>

  <div class="card">
    <h2>📊 종목</h2>
    <div id="stockList"></div>
  </div>

  <div class="card">
    <h2>🏆 실시간 순위</h2>
    <div id="rank"></div>
  </div>

  <div class="card">
    <h2>🔐 관리자</h2>

    <div id="adminLogin">
      <input id="adminPassword" type="password" placeholder="관리자 비밀번호">
      <button class="primary" onclick="adminLogin()">로그인</button>
    </div>

    <div id="adminControls">
      <button class="primary" onclick="adminStart()">게임 시작</button>
      <button onclick="adminStop()">게임 종료</button>
      <button onclick="adminReset()">전체 초기화</button>
      <button onclick="downloadCSV()">결과 CSV 다운로드</button>
    </div>

    <div class="muted" style="margin-top:8px">
      진행자 기기에서만 관리 기능을 사용하세요.
    </div>
  </div>

  <div id="msg" class="muted"></div>
</div>

<script src="/socket.io/socket.io.js"></script>

<script>
const socket=io();

let state=null;
let stockRowsCreated=false;
let isAdmin=false;

const quantityValues=new Map();

const $=id=>document.getElementById(id);

const won=n=>"₩"+Math.round(n).toLocaleString("ko-KR");

function escapeHTML(value){
  return String(value??"").replace(/[&<>"']/g,char=>({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#39;"
  })[char]);
}

function join(){
  const name=$("name").value.trim();

  if(!name){
    showMessage("닉네임을 입력해 주세요.");
    return;
  }

  socket.emit("join",name);
}

$("name").addEventListener("keydown",event=>{
  if(event.key==="Enter")join();
});

$("adminPassword").addEventListener("keydown",event=>{
  if(event.key==="Enter")adminLogin();
});

function fmt(x){
  const seconds=Math.max(0,Number(x)||0);

  return String(Math.floor(seconds/60)).padStart(2,"0")+":"+
    String(seconds%60).padStart(2,"0");
}

function showMessage(message){
  $("msg").textContent=message;
}

socket.on("connect",()=>{
  console.log("서버 연결 완료:",socket.id);
});

socket.on("disconnect",()=>{
  showMessage("서버 연결이 끊겼습니다. 다시 연결하는 중입니다.");
});

socket.on("joined",()=>{
  $("login").style.display="none";
  $("game").style.display="block";
  showMessage("게임 참가가 완료되었습니다.");
});

socket.on("adminAuth",()=>{
  isAdmin=true;
  $("adminLogin").style.display="none";
  $("adminControls").style.display="block";
  showMessage("관리자 로그인에 성공했습니다.");
});

socket.on("errorMsg",message=>{
  showMessage(message);
});

socket.on("tradeSuccess",message=>{
  showMessage(message);
});

socket.on("state",newState=>{
  state=newState;
  render();
});

socket.on("newsUpdate",items=>{
  if(!state)state={};

  state.news=Array.isArray(items)?items:[];

  renderNews();
});

function trade(id,side){
  const input=$("q_"+id);

  if(!input)return;

  const raw=input.value.trim();

  if(!/^[0-9]+$/.test(raw)){
    showMessage("수량은 숫자로 입력해 주세요.");
    input.focus();
    return;
  }

  const quantity=Number(raw);

  if(!Number.isSafeInteger(quantity)||quantity<=0||quantity>10000){
    showMessage("수량은 1~10,000주까지 입력할 수 있습니다.");
    input.focus();
    return;
  }

  quantityValues.set(id,raw);

  socket.emit("trade",{
    id,
    side,
    qty:quantity
  });
}

function createStockRows(){
  const stockList=$("stockList");

  stockList.innerHTML="";

  for(const id of Object.keys(state.prices)){
    const row=document.createElement("div");

    row.className="row";
    row.id="stock_"+id;

    row.innerHTML=`
      <div class="stock-info">
        <b class="stock-name"></b>
        <div class="muted">${escapeHTML(id)}</div>
      </div>

      <b class="stock-price"></b>

      <div class="actions">
        <input
          id="q_${id}"
          type="text"
          inputmode="numeric"
          pattern="[0-9]*"
          autocomplete="off"
          value="${escapeHTML(quantityValues.get(id)||"1")}"
          placeholder="수량"
          aria-label="${escapeHTML(id)} 거래 수량"
        >

        <button class="buy" type="button">매수</button>
        <button class="sell" type="button">매도</button>
      </div>
    `;

    row.querySelector(".stock-name").textContent=
      state.companyNames?.[id]||id;

    const quantityInput=row.querySelector("#q_"+id);

    quantityInput.addEventListener("input",()=>{
      quantityValues.set(id,quantityInput.value);
    });

    row.querySelector(".buy").addEventListener("click",()=>{
      trade(id,"buy");
    });

    row.querySelector(".sell").addEventListener("click",()=>{
      trade(id,"sell");
    });

    stockList.appendChild(row);
  }

  stockRowsCreated=true;
}

/* 현재 주가 + 직전 변동 대비 등락 금액 + 등락률 */
function updateStockRows(){
  if(!state?.prices)return;

  for(const id of Object.keys(state.prices)){
    const row=$("stock_"+id);

    if(!row)continue;

    const price=state.prices[id];

    const previous=state.previousPrices?.[id]??price;

    const change=price-previous;

    const rate=previous>0
      ?change/previous*100
      :0;

    const arrow=
      change>0?"▲":
      change<0?"▼":"";

    let changeText;

    if(change>0){
      changeText=
        `▲ ${won(change)} (+${rate.toFixed(2)}%)`;
    }else if(change<0){
      changeText=
        `▼ ${won(Math.abs(change))} (${rate.toFixed(2)}%)`;
    }else{
      changeText="0.00%";
    }

    const priceElement=row.querySelector(".stock-price");

    priceElement.textContent=
      `${won(price)}  ${changeText}`;

    priceElement.className=
      "stock-price "+
      (change>0?"up":change<0?"down":"");
  }
}

function renderNews(){
  const newsList=$("newsList");

  if(!newsList)return;

  const items=Array.isArray(state?.news)?state.news:[];

  if(items.length===0){
    newsList.innerHTML=
      '<div class="muted">새로운 뉴스가 생성되기를 기다리는 중입니다.</div>';

    return;
  }

  newsList.innerHTML=items.map(item=>`
    <div class="news-item">
      <div class="news-top">
        <span class="news-category">${escapeHTML(item.category)}</span>
        <span class="news-time">${escapeHTML(item.time)}</span>
      </div>

      <div class="news-title">${escapeHTML(item.title)}</div>
      <div class="news-description">${escapeHTML(item.description)}</div>
    </div>
  `).join("");
}

function renderHoldings(me){
  const holdingsList=$("holdingsList");

  const holdings=Object.entries(me?.holdings||{})
    .filter(([id,quantity])=>quantity>0);

  if(holdings.length===0){
    holdingsList.innerHTML=
      '<div class="muted">아직 보유한 주식이 없습니다.</div>';

    return;
  }

  holdingsList.innerHTML=holdings.map(([id,quantity])=>{
    const name=state.companyNames?.[id]||id;

    const price=state.prices[id]||0;

    const value=price*quantity;

    return `
      <div class="row">
        <div>
          <b>${escapeHTML(name)}</b>
          <div class="muted">${escapeHTML(id)}</div>
        </div>

        <div style="text-align:right">
          <b>${quantity.toLocaleString("ko-KR")}주</b>
          <div class="muted">평가금액 ${won(value)}</div>
        </div>
      </div>
    `;
  }).join("");
}

function renderRank(){
  const leaderboard=state?.leaderboard||[];

  $("rank").innerHTML=leaderboard.map((player,index)=>`
    <div class="row">
      <b>${index+1}위 ${escapeHTML(player.name)}</b>
      <span>${won(player.assets)}</span>
    </div>
  `).join("")||'<div class="muted">참가자가 없습니다.</div>';
}

function render(){
  if(!state)return;

  const me=(state.leaderboard||[]).find(
    player=>player.id===socket.id
  );

  if(me){
    $("assets").textContent=won(me.assets);

    $("cash").textContent=won(me.cash);

    $("ret").textContent=
      (me.returnRate>=0?"+":"")+
      me.returnRate.toFixed(2)+"%";

    $("ret").className=
      "big "+(me.returnRate>=0?"up":"down");

    renderHoldings(me);
  }

  $("status").textContent=
    state.status==="running"
      ?`🟢 진행 중 · 다음 가격 변동 ${fmt(state.seconds)}`
      :state.status==="finished"
        ?"🔴 게임 종료"
        :"🟡 대기 중";

  if(!stockRowsCreated&&state.prices){
    createStockRows();
  }

  updateStockRows();

  renderNews();
  renderRank();
}

function adminLogin(){
  const password=$("adminPassword").value;

  if(!password){
    showMessage("관리자 비밀번호를 입력해 주세요.");
    return;
  }

  socket.emit("adminLogin",password);
}

function adminStart(){
  socket.emit("adminStart");
}

function adminStop(){
  socket.emit("adminStop");
}

function adminReset(){
  if(confirm("전체 참가자를 초기화할까요?")){
    socket.emit("adminReset");
  }
}

function downloadCSV(){
  if(!isAdmin){
    showMessage("관리자 로그인이 필요합니다.");
    return;
  }

  const url="/api/results.csv?socketId="+
    encodeURIComponent(socket.id);

  window.location.href=url;
}
</script>
</body>
</html>
