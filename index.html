<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>꿈틀꿈틀 모의주식</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f5f7;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR",sans-serif;color:#17181a}.wrap{max-width:900px;margin:auto;padding:16px}.card{background:#fff;border-radius:18px;padding:18px;margin:12px 0;box-shadow:0 2px 12px #0000000d}h1{margin:0 0 5px}h2{font-size:19px}.muted{color:#777;font-size:13px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{background:#f7f7f8;border-radius:13px;padding:13px}.big{font-size:21px;font-weight:800;margin-top:4px}.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px 0;border-bottom:1px solid #eee}.row:last-child{border:0}.actions{display:flex;gap:5px;align-items:center}.actions input{width:55px}input,button{padding:10px;border:1px solid #ddd;border-radius:10px;font-size:15px}button{border:0;font-weight:700}.primary{background:#111;color:white}.buy{background:#eaf1ff;color:#2363d1}.sell{background:#ffeded;color:#d33}.up{color:#d33}.down{color:#2866c7}@media(max-width:600px){.stats{grid-template-columns:1fr}.row{flex-wrap:wrap}.actions{width:100%}}#game{display:none}</style></head><body><div class="wrap"><div class="card"><h1>📈 꿈틀꿈틀 실시간 모의주식</h1><div class="muted">모든 참가자가 같은 주가를 공유합니다.</div><div id="login" style="margin-top:14px"><input id="name" maxlength="20" placeholder="닉네임"><button class="primary" onclick="join()">참가하기</button></div><div id="game"><p id="status"></p><div class="stats"><div class="stat">총자산<div id="assets" class="big">₩1,000,000</div></div><div class="stat">수익률<div id="ret" class="big">0.00%</div></div><div class="stat">현금<div id="cash" class="big">₩1,000,000</div></div></div></div></div><div class="card" id="stocks"><h2>종목</h2><div id="stockList"></div></div><div class="card"><h2>🏆 실시간 순위</h2><div id="rank"></div></div><div class="card"><h2>관리자</h2><button class="primary" onclick="adminStart()">게임 시작</button> <button onclick="adminStop()">게임 종료</button> <button onclick="adminReset()">전체 초기화</button><div class="muted" style="margin-top:8px">진행자 기기에서만 관리 버튼을 사용하세요.</div></div><div id="msg" class="muted"></div></div><script src="/socket.io/socket.io.js"></script><script>const socket=io();let state;const $=x=>document.getElementById(x);const won=n=>'₩'+Math.round(n).toLocaleString('ko-KR');function join(){const n=$('name').value.trim();if(n)socket.emit('join',n)}function fmt(x){return String(Math.floor(x/60)).padStart(2,'0')+':'+String(x%60).padStart(2,'0')}socket.on('joined',()=>{$('login').style.display='none';$('game').style.display='block'});socket.on('errorMsg',m=>{$('msg').textContent=m;setTimeout(()=>$('msg').textContent='',2500)});socket.on('state',s=>{state=s;render()});function trade(id,side){const q=+document.querySelector('#q_'+id).value||0;socket.emit('trade',{id,qty:q,side})}function render(){if(!state)return;const me=state.leaderboard.find(x=>x.id===socket.id);if(me){$('assets').textContent=won(me.assets);$('ret').textContent=(me.returnRate>=0?'+':'')+me.returnRate.toFixed(2)+'%';$('cash').textContent=won(me.assets)}$('status').innerHTML=state.status==='running'?`🟢 진행 중 · 다음 가격 변동 ${fmt(state.seconds)}`:state.status==='finished'?'🔴 종료':'🟡 대기 중';$('stockList').innerHTML=Object.entries(state.prices).map(([id,p])=>`<div class="row"><div><b>${state.names[id]}</b><div class="muted">${id}</div></div><b>${won(p)}</b><div class="actions"><input id="q_${id}" type="number" min="1" value="1"><button class="buy" onclick="trade('${id}','buy')">매수</button><button class="sell" onclick="trade('${id}','sell')">매도</button></div></div>`).join('');$('rank').innerHTML=state.leaderboard.length?state.leaderboard.map((x,i)=>`<div class="row"><span><b>${i+1}위</b> ${x.name}</span><span>${won(x.assets)} · <b class="${x.returnRate>=0?'up':'down'}">${x.returnRate>=0?'+':''}${x.returnRate.toFixed(2)}%</b></span></div>`).join(''):'<span class="muted">참가자를 기다리는 중...</span>'}function adminStart(){socket.emit('adminStart')}function adminStop(){socket.emit('adminStop')}function adminReset(){if(confirm('전체 참가자를 초기화할까요?'))socket.emit('adminReset')}</script></body></html>
